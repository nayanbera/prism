[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism"
version = "0.1.0"
description = "PRISM — Partial scattering Resolution via Intensity Spectral Modulation"
requires-python = ">=3.11"
dependencies = [
    "PyQt6",
    "pyqtgraph",
    "numpy",
    "scipy",
    "xraylib",
]

[project.optional-dependencies]
hdf = ["h5py"]

[project.scripts]
prism = "prism.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
